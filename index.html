// Simple mail sender (internal use)
async function sendMail({ targetEmail, subject, body }) {
  try {
    if (!MAIL_WEBAPP_URL) throw new Error("MAIL_WEBAPP_URL 未設定");
    if (!targetEmail) throw new Error("targetEmail 為空，未寄信");

    // 使用 x-www-form-urlencoded 避免瀏覽器 CORS preflight（GitHub Pages 常見）
    const form = new URLSearchParams();
    form.append("key", MAIL_SECRET_KEY);
    form.append("targetEmail", targetEmail);
    form.append("subject", subject || "");
    form.append("body", body || "");

    // 逾時控制（避免一直轉圈/無回應）
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);

    const r = await fetch(MAIL_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
      body: form.toString(),
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    const t = await r.text();
    let j = null;
    try { j = JSON.parse(t); } catch {}

    if (!r.ok) throw new Error(`HTTP ${r.status}：${(t || "").slice(0, 200)}`);
    if (!j) throw new Error(`非 JSON 回應：${(t || "").slice(0, 200)}`);
    if (j.status !== "success") throw new Error(j.message || "寄信失敗");

    console.log("Mail sent:", j);
    return true;
  } catch (e) {
    const msg = (e && e.name === "AbortError") ? "寄信逾時（12 秒未回應），請稍後再試或檢查 Apps Script 部署/權限" : (e?.message || String(e));
    alert("寄信失敗：" + msg);
    console.warn("sendMail error:", e);
    return false;
  }
}

// --- Helper Function: Get Local Date String without UTC shifting issues ---
const getLocalDateString = (d = new Date()) => {
const tzOffset = d.getTimezoneOffset() * 60000;
return new Date(d.getTime() - tzOffset).toISOString().split('T')[0];
};

// --- Helper: Effective leave hours for stats (跨天以 8 小時/天計) ---
// 用於假別統計等跨日計算：若跨天，直接以「天數 * 8 小時」計算，避免時段格式差異造成誤差
const getEffectiveLeaveHours = (l) => {
  try {
    const s = (l.start || '').split('T')[0];
    const e = (l.end || '').split('T')[0];
    if (!s || !e) return Number(l.hours || 0);
    if (s === e) return Number(l.hours || 0);
    const sd = new Date(s + 'T00:00');
    const ed = new Date(e + 'T00:00');
    const days = Math.floor((ed - sd) / 86400000) + 1;
    return Math.max(0, days) * 8;
  } catch {
    return Number(l.hours || 0);
  }
};

setWorkTags(t);

const t = areaTags.filter(item => item !== val);
setAreaTags(t);

const handleUpdateTag = (type, oldVal, newVal) => {

const t = areaTags.map(item => item === oldVal ? newVal : item);
setAreaTags(t);
localStorage.setItem('areaTags', JSON.stringify(t));
if (settings.areaColors && settings.areaColors[oldVal]) {
const newColors = { ...settings.areaColors };
newColors[newVal] = newColors[oldVal];
delete newColors[oldVal];
setSettings(prev => ({ ...prev, areaColors: newColors}));
localStorage.setItem('areaColors', JSON.stringify(newColors));}
} else if(type === 'work') {
if (workTags.includes(newVal)) { alert("此項目已存在"); return; }
const t = workTags.map(item => item === oldVal ? newVal : item);
setWorkTags(t);
localStorage.setItem('workTags', JSON.stringify(t));}
};
const handleManageLeaveTypes = (action, val) => {

localStorage.setItem('leaveTypes', JSON.stringify(newTypes));
} else if (action === 'delete') {
if(!confirm("確定要刪除此假別嗎？")) return;
const newTypes = leaveTypes.filter(t => t.id !== val);
setLeaveTypes(newTypes);
localStorage.setItem('leaveTypes', JSON.stringify(newTypes));
} else if (action === 'update' && val) {
const newTypes = leaveTypes.map(t => t.id === val.id ? val : t);
setLeaveTypes(newTypes);
localStorage.setItem('leaveTypes', JSON.stringify(newTypes));}}
const toggleSidebarTheme = () => {

createEvent: async (d) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'calendar_events'), d),

createLeave: async (d) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaves'), d),
updateLeave: async (id, data) => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'leaves', id), { ...data, approvalDate: new Date() }),

};
if (loading) return (
<div className="h-screen flex flex-col items-center justify-center bg-gray-50 text-gray-600 gap-4">

if (!user || !userData) return <LoginScreen auth={auth} />;

const totalAlert = pendingApprovalCount + myPendingDeputy;
const approvalMenuCount = (userData.role === 'leader' || userData.role === 'admin') ? totalAlert : myPendingDeputy;
const isLight = sidebarTheme === 'light';
const sidebarBg = isLight ? 'bg-white border-r border-gray-200 text-gray-800' : 'bg-slate-800 text-gray-100 border-r border-slate-700';
const sidebarHover = isLight ? 'hover:bg-gray-100' : 'hover:bg-slate-700';

function Dashboard({ user, leaves, calendarEvents, setView, leaveTypes }) {
const [weeksToShow, setWeeksToShow] = useState(1);
const today = new Date();
const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
const todayStr = getLocalDateString(today);
const myDeputyPendingCount = leaves.filter(l => (l.deputyId === user.uid || l.deputyId === user.docId || l.deputyId === (user.email||'').toLowerCase()) && l.status === 'pending').length;
const teamDeputyPendingCount = (user.role === 'leader' || user.role === 'admin') ? leaves.filter(l => l.status === 'pending' && !!l.deputyId).length : 0;
const teamLeaderPendingCount = (user.role === 'leader' || user.role === 'admin') ? leaves.filter(l => l.status === 'deputy_signed').length : 0;
const myPendingCount = leaves.filter(l => (l.requesterId === user.uid || l.requesterId === user.docId) && (l.status === 'pending' || l.status === 'deputy_signed')).length;
const personalLeaveTypeNames = leaveTypes.filter(t => t.category === 'personal').map(t => t.name);
const todayLeavesDetails = leaves.filter(l => l.start.startsWith(todayStr) && l.status === 'approved' && personalLeaveTypeNames.includes(l.type)).map(l => {
const timeStr = l.hours >= 8 ? '整天' : (l.start.includes('T08') || l.start.includes('T09') ? '上午' : '下午');
return `${l.requesterName}(${timeStr})`;
});
const todayExternalDetails = [];
calendarEvents.filter(e => e.date === todayStr && e.type === 'person').forEach(p => {
const tagEv = calendarEvents.find(t => t.groupId === p.groupId && t.type === 'tag');
if (tagEv && EXTERNAL_WORK_TAGS.includes(tagEv.item)) {
const s = p.slot === 'morning' ? '上午' : (p.slot === 'afternoon' ? '下午' : '整天');
todayExternalDetails.push(`${p.userName}(${s})`);}
});
const uniqueExternalDetails = [...new Set(todayExternalDetails)];
const getWeekData = () => {
const start = new Date(today);
start.setDate(today.getDate() - today.getDay() + 1);
const week = [];
const totalDays = weeksToShow * 7;
for(let i=0; i<totalDays; i++) {
const d = new Date(start);
d.setDate(start.getDate() + i);
if (d.getDay() === 0 || d.getDay() === 6) continue;
const dStr = getLocalDateString(d);
const externalPeople = { morning: [], afternoon: [], all_day: [] };
calendarEvents.filter(e => e.date === dStr && e.type === 'person').forEach(p => {
const tagEv = calendarEvents.find(t => t.groupId === p.groupId && t.type === 'tag');
if (tagEv && EXTERNAL_WORK_TAGS.includes(tagEv.item)) {
const s = p.slot || 'all_day';
if(externalPeople[s] && !externalPeople[s].includes(p.userName)) {
externalPeople[s].push(p.userName);}}
});
week.push({ day: weekDays[d.getDay()], date: dStr, external: externalPeople });}
return week;
};
const weekData = getWeekData();
const hour = today.getHours();
let greeting = "";
let greetingIcon = "👋";
if (hour >= 5 && hour < 12) { greeting = "早安！一日之計在於晨"; greetingIcon = "☀️"; }
else if (hour >= 12 && hour < 14) { greeting = "午安！記得好好吃頓午餐喔"; greetingIcon = "🍱"; }
else if (hour >= 14 && hour < 18) { greeting = "下午好！喝杯茶提提神，繼續加油"; greetingIcon = "☕️"; }
else if (hour >= 18 && hour < 22) { greeting = "晚安！今天也辛苦了，好好休息"; greetingIcon = "🌙"; }
else { greeting = "夜深了，還在忙嗎？要注意肝臟健康喔"; greetingIcon = "🦉"; }
return (
<div className="space-y-6 max-w-5xl mx-auto">

{WEATHER_LOCATIONS.map((w,i)=>(

<div onClick={() => setView('personal')} className="bg-white p-5 rounded-lg shadow-sm border-l-4 border-purple-500 cursor-pointer hover:bg-purple-50 transition h-full flex flex-col"><h3 className="text-gray-500 text-sm font-medium flex items-center justify-between">我的請假進度 <ArrowRight size={16}/></h3><span className="text-2xl font-bold text-purple-600 block mt-1 mb-1">{myPendingCount} 筆</span><span className="text-xs text-gray-500 mt-auto">審核中尚未核准</span></div>

return (

{isMonday && idx !== 0 && <tr><td colSpan="4" className="bg-gray-100/50 py-1"></td></tr>}
<tr className={`border-b last:border-0 hover:bg-gray-50 transition ${isMonday ? 'border-t-2 border-t-gray-200' : ''}`}>

<td className="p-2"><div className="flex gap-1 flex-wrap">{d.external.morning.length > 0 ? d.external.morning.map((n,i)=><span key={i} className="bg-yellow-100 text-yellow-800 px-1.5 py-0.5 rounded text-[11px] whitespace-nowrap">{n}</span>) : '-'}</div></td>
<td className="p-2"><div className="flex gap-1 flex-wrap">{d.external.afternoon.length > 0 ? d.external.afternoon.map((n,i)=><span key={i} className="bg-orange-100 text-orange-800 px-1.5 py-0.5 rounded text-[11px] whitespace-nowrap">{n}</span>) : '-'}</div></td>
<td className="p-2"><div className="flex gap-1 flex-wrap">{d.external.all_day.length > 0 ? d.external.all_day.map((n,i)=><span key={i} className="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded text-[11px] whitespace-nowrap">{n}</span>) : '-'}</div></td></tr></React.Fragment>
)})}</tbody></table></div></div></div>);}
function CalendarView({ users, events, leaves, importantItems, crud, tags, settings, rotationRules, onUpdateRotationRules }) {
const [date, setDate] = useState(new Date());

const [modalOpen, setModalOpen] = useState(false);
const [rotationModalOpen, setRotationModalOpen] = useState(false);
const [modalData, setModalData] = useState({ date: '', workItem: '', note: '' });
const [selSlot, setSelSlot] = useState('morning');
const [selAreas, setSelAreas] = useState([]); // 修改：改為陣列支援複選
const [selUsers, setSelUsers] = useState([]);
const [editGroupId, setEditGroupId] = useState(null);
const [isSubmitting, setIsSubmitting] = useState(false);
const [importantModalOpen, setImportantModalOpen] = useState(false);
const [importantForm, setImportantForm] = useState({ id: null, date: '', owner: '', text: '' });
useEffect(()=>{try{if((importantItems||[]).length===0&&!localStorage.getItem('important_seed_v1')){localStorage.setItem('important_seed_v1','1');crud.createImportantItem({date:'2026-03-05',owner:'方姿云',text:'第一期成果報告（工作項目：分配等等）',createdAt:new Date()});}}catch(e){}},[importantItems,crud]);

  return (importantItems || [])

    .sort((a,b)=> new Date(a.date)-new Date(b.date));
}, [importantItems]);
const openImportantNew = () => { setImportantForm({ id:null, date:getLocalDateString(new Date()), owner:'', text:'' }); setImportantModalOpen(true); };
const openImportantEdit = (it) => { setImportantForm({ id: it.id, date: it.date || '', owner: it.owner || '', text: it.text || '' }); setImportantModalOpen(true); };

  try {
    if(importantForm.id) await crud.updateImportantItem(importantForm.id, { date: importantForm.date, owner: importantForm.owner || '', text: importantForm.text, updatedAt: new Date() });

const getDaysInMonth = (d) => new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();

const rotationStats = useMemo(() => {
const currentYear = new Date().getFullYear();
const stats = {};
rotationRules.forEach(rule => { stats[rule.id] = {}; rule.order.forEach(name => stats[rule.id][name] = 0); });
events.forEach(e => {
if (e.type === 'person' && new Date(e.date).getFullYear() === currentYear) {
const tagEv = events.find(t => t.groupId === e.groupId && t.type === 'tag');
if (tagEv) {
const rule = rotationRules.find(r => r.matchTag === tagEv.item);
if (rule && stats[rule.id][e.userName] !== undefined) stats[rule.id][e.userName]++;}}
});
return stats;
}, [events, rotationRules]);
const getNextRotationPerson = (matchTag) => {
const rule = rotationRules.find(r => r.matchTag === matchTag);
if (!rule) return null;
const sortedEvents = [...events].filter(e => e.type === 'tag' && e.item === matchTag).sort((a,b) => new Date(b.date) - new Date(a.date));
let next = rule.order[0];
let lastDate = null;
if (sortedEvents.length > 0) {
lastDate = sortedEvents[0].date;
const lastGroup = sortedEvents[0].groupId;
const pplInGroup = events.filter(e => e.groupId === lastGroup && e.type === 'person').map(e=>e.userName);
const presentIndexes = pplInGroup.map(p => rule.order.indexOf(p)).filter(i => i !== -1);
if (presentIndexes.length > 0) {
const maxIndex = Math.max( ...presentIndexes);
next = rule.order[(maxIndex + 1) % rule.order.length];}}
return { user: users.find(u => u.name === next), lastDate };
};
const rotationData = rotationRules.map(rule => {
const info = getNextRotationPerson(rule.matchTag);
return { ...rule, nextPerson: info?.user?.name || rule.order[0], lastDate: info?.lastDate };
});

setEditGroupId(null);
setModalOpen(true);
};
const handleEventClick = (e, groupEvents) => {

setSelSlot(tagEv.slot || 'all_day');

setSelAreas(Array.isArray(tagEv.area) ? tagEv.area : (tagEv.area ? [tagEv.area] : []));
setSelUsers(personEvs.map(p => p.userId));
setEditGroupId(tagEv.groupId);
setModalOpen(true);}
};
const handleRotationClick = (rule) => {
setModalData(prev => ({ ...prev, workItem: rule.matchTag}));
const info = getNextRotationPerson(rule.matchTag);
if (info?.user) setSelUsers([info.user.uid || info.user.docId]);
else setSelUsers([]);
};

if(!editGroupId) return;

await crud.deleteEventsByGroup(editGroupId);
setModalOpen(false);}}
const handleModalSave = async () => {
if(!modalData.workItem) { alert("請選擇工作項目"); return; }
let conflictMsg = "";
for(const uid of selUsers) {
const userEvents = events.filter(e => e.date === modalData.date && e.type === 'person' && e.userId === uid && e.groupId !== editGroupId);
const hasAllDay = userEvents.find(e => e.slot === 'all_day');
const hasMorning = userEvents.find(e => e.slot === 'morning');
const hasAfternoon = userEvents.find(e => e.slot === 'afternoon');
const uName = users.find(u=>u.uid === uid || u.docId === uid)?.name;
if (selSlot === 'all_day' && (hasMorning || hasAfternoon || hasAllDay)) { conflictMsg = `衝突警示：\n${uName} 在該日已有「${hasMorning?'上午':(hasAfternoon?'下午':'整天')}」行程，無法再排整天。`; } else if (selSlot === 'morning' && (hasAllDay || hasMorning)) { conflictMsg = `衝突警示：\n${uName} 在該日已有「${hasAllDay?'整天':'上午'}」行程。`; } else if (selSlot === 'afternoon' && (hasAllDay || hasAfternoon)) { conflictMsg = `衝突警示：\n${uName} 在該日已有「${hasAllDay?'整天':'下午'}」行程。`; }}
if (conflictMsg) { alert(conflictMsg); return; }
setIsSubmitting(true);
try {

const groupId = `g_${Date.now()}`;
// 儲存 selAreas 陣列
await crud.createEvent({ groupId, date: modalData.date, type: 'tag', itemId: modalData.workItem, item: modalData.workItem, area: selAreas, slot: selSlot, note: modalData.note, timestamp: new Date() });
for(const uid of selUsers) {
const u = users.find(x=>x.uid === uid || x.docId === uid);
if(u) await crud.createEvent({ groupId, date: modalData.date, type: 'person', userId: u.uid || u.docId, userName: u.name, userAvatar: u.initials, userColor: u.color, slot: selSlot, timestamp: new Date() });}
setModalOpen(false);
alert(editGroupId ? '行程修改完成' : '行程新增完成');
} catch (e) { alert('儲存失敗：' + e.message); } finally { setIsSubmitting(false); }
};
const renderGrid = () => {
const cells = [];
const isMonth = viewMode === 'month';
if (isMonth) {
const startDay = getFirstDayOfMonth(date);
const totalDays = getDaysInMonth(date);
for(let i=0; i<startDay; i++) cells.push(<div key={`empty-${i}`} className="bg-gray-50/50 border-b border-r border-gray-100 min-h-[120px] md:min-h-[14vh]"></div>);
for(let i=1; i<=totalDays; i++) {
const d = new Date(date.getFullYear(), date.getMonth(), i);
cells.push(renderDayCell(d));}
} else {
const day = date.getDay();
const diff = date.getDate() - day + 1;
const weekStart = new Date(date);
weekStart.setDate(diff);
for(let i=0; i<7; i++) {
const d = new Date(weekStart);
d.setDate(weekStart.getDate() + i);
cells.push(renderDayCell(d));}}
return cells;
};
const renderDayCell = (dObj) => {
const dStr = getLocalDateString(dObj);
const dayEvs = events.filter(e => e.date === dStr);
const isToday = dStr === getLocalDateString(new Date());
const dayOfWeek = dObj.getDay();
const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

if (e.type === 'person') groups[e.groupId].people.push(e);
});

>
<div className="flex justify-between items-start gap-1 mb-1">

)}</div>
{(note || g.people.length > 0) && (

<div className="flex flex-wrap gap-1">

return <UserAvatar key={p.id} user={displayUser} size="w-7 h-7 md:w-8 md:h-8" textSize="text-xs md:text-sm" className="shadow-sm border-white border-[1.5px]" />;
})}</div>
{note && <span className="text-[10px] md:text-xs text-gray-400 truncate max-w-[80px] ml-2" title={note}>{note}</span>}</div>
)}
<button onClick={(e)=>{e.stopPropagation(); if(confirm('刪除?')) crud.deleteEventsByGroup(groupId)}}
className="absolute -top-2 -right-2 p-1 bg-white rounded-full shadow-md opacity-0 group-hover/item:opacity-100 text-gray-400 hover:text-red-500 transition-opacity">
<X size={14}/></button></div>);
};
const renderLeaves = () => {
const leavesOnDay = leaves.filter(l =>
l.status !== 'rejected' && l.status !== 'withdrawn' &&
dStr >= l.start.split('T')[0] &&
dStr <= l.end.split('T')[0] &&
!["出差", "公出", "公假", "加班申請(列計)", "加班申請(不列計)", "榮譽假(獲得)"].includes(l.type));
return leavesOnDay.map(l => (

};
return (<div key={dStr} className={`border-b border-r border-gray-200 p-1.5 md:p-2 min-h-[120px] md:min-h-[14vh] relative transition-colors flex flex-col group hover:bg-gray-50`} onClick={() => handleDayClick(dObj)}><div className="w-full flex justify-between items-start mb-2"><div className="flex flex-col items-center w-full"><span className={`text-sm md:text-base font-bold px-3 py-0.5 w-full text-center rounded-md ${isToday ? 'bg-yellow-300 text-black shadow-sm' : (isWeekend || isHoliday ? 'text-red-500' : 'text-gray-700')}`}>{dObj.getDate()} {isHoliday && <span className="ml-1 text-[10px] md:text-xs bg-red-500 text-white px-1.5 py-0.5 rounded align-middle">{holidayName}</span>}</span></div><div className="absolute top-2 right-2"><Edit2 size={16} className="text-gray-300 group-hover:text-blue-500 opacity-0 group-hover:opacity-100 transition"/></div></div>
<div className="flex-1 flex flex-col gap-1 overflow-hidden" onClick={e=>e.stopPropagation()}>

{slots.morning.length > 0 && <div className="mb-1"><div className="text-xs font-bold text-emerald-700 mb-1.5 sticky top-0 z-0 pl-1">▍上午</div>{slots.morning.map(g => renderGroup(g, 'morning'))}</div>}
{slots.afternoon.length > 0 && <div className="mb-1"><div className="text-xs font-bold text-orange-700 mb-1.5 sticky top-0 z-0 pl-1">▍下午</div>{slots.afternoon.map(g => renderGroup(g, 'afternoon'))}</div>}

};
return (

<button className="p-1.5 hover:bg-gray-100" onClick={()=>setDate(new Date(date.getFullYear(), date.getMonth()-1, 1))}><ChevronLeft size={16}/></button>
<button className="p-1.5 hover:bg-gray-100" onClick={()=>setDate(new Date(date.getFullYear(), date.getMonth()+1, 1))}><ChevronRight size={16}/></button></div>
<div className="flex bg-white rounded border shadow-sm ml-2 text-xs">

<button onClick={()=>setViewMode('week')} className={`px-3 py-1.5 ${viewMode==='week'?'bg-slate-800 text-white':'hover:bg-gray-50'}`}>週</button></div></div>
<button onClick={openImportantNew} className="text-xs bg-white px-3 py-1.5 rounded border shadow-sm flex items-center gap-1 hover:bg-amber-50 text-amber-700 font-bold"><Bell size={14}/> 重要事項</button>
<button onClick={()=>setRotationModalOpen(true)} className="text-xs bg-white px-3 py-1.5 rounded border shadow-sm flex items-center gap-1 hover:bg-blue-50 text-blue-600 font-bold"><RefreshCw size={14}/> 輪序表</button></div>

return (
<button key={it.id} onClick={()=>openImportantEdit(it)} className="px-2 py-1 rounded-full border bg-amber-50 hover:bg-amber-100 text-xs text-amber-900 flex items-center gap-2">

<span className="truncate max-w-[220px]">{it.text}</span>
<span className="font-bold">D-{Math.max(daysLeft,0)}</span>
</button>
);
})}
</div>
</div>
)}
<div className="flex-1 overflow-auto">
<div className="min-w-[600px] h-full flex flex-col">
<div className="grid grid-cols-7 border-b bg-white text-center text-sm md:text-base font-bold text-gray-500 py-2 sticky top-0 z-10 shadow-sm">{['日','一','二','三','四','五','六'].map((d,i)=><div key={i} className={i===0||i===6?'text-red-500':''}>{d}</div>)}</div>
<div className="flex-1 grid grid-cols-7 auto-rows-auto bg-white">{renderGrid()}</div></div></div></div>
<RotationModal open={rotationModalOpen} onClose={()=>setRotationModalOpen(false)} rules={rotationRules} onUpdateRules={onUpdateRotationRules} rotationData={rotationData} rotationStats={rotationStats}/>
{modalOpen && (

<div className="bg-white rounded-xl w-full max-w-md shadow-2xl flex flex-col max-h-[90vh]" onClick={e=>e.stopPropagation()}>
<div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">

<button onClick={()=>setModalOpen(false)} className="text-gray-400 hover:text-gray-600"><X size={20}/></button></div>
<div className="p-4 overflow-y-auto space-y-5">
<div>

<div className="grid grid-cols-2 gap-2">

{tags.workTags.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
<div>

{a}</button>)

<div>

<div className="text-gray-600 text-xs">{name}</div></div>
<button onClick={()=>handleDeleteHoliday(date)} className="text-gray-400 hover:text-red-600 p-1.5 bg-red-50 rounded"><Trash2 size={14}/></button></div>
))}
{Object.keys(customHolidays).length === 0 && <div className="text-sm text-gray-400 sm:col-span-2 lg:col-span-3">尚未設定任何自訂特別假日。</div>}</div></div>
<div className="bg-white p-6 rounded shadow-sm"><h2 className="text-xl font-bold mb-4 flex items-center gap-2"><List/> 假別設定 & 說明 (區段分類)</h2><div className={`border rounded-lg p-4 mb-6 transition-colors ${editLeaveId ? 'bg-yellow-50 border-yellow-300' : 'bg-gray-50'}`}><h3 className="text-sm font-bold text-gray-700 mb-3 flex items-center justify-between"><span>{editLeaveId ? '修改假別' : '新增假別'}</span>{editLeaveId && <button onClick={()=>{setEditLeaveId(null); setNewLeave({name:'', category:'personal', desc:''});}} className="text-xs text-gray-500 hover:text-gray-800 underline">取消編輯</button>}</h3><div className="grid grid-cols-1 md:grid-cols-4 gap-3"><div className="md:col-span-1"><select className="border rounded px-3 py-2 text-sm w-full bg-white" value={newLeave.category} onChange={e=>setNewLeave({ ...newLeave, category: e.target.value})}><option value="official">區段一: 公務/加班</option><option value="personal">區段二: 私假</option></select></div><div className="md:col-span-1"><input className="border rounded px-3 py-2 text-sm w-full bg-white" placeholder="假別名稱 (例: 特休)" value={newLeave.name} onChange={e=>setNewLeave({ ...newLeave, name: e.target.value})} /></div><div className="md:col-span-2 flex gap-2"><input className="border rounded px-3 py-2 text-sm flex-1 bg-white" placeholder="勞基法說明 (例: 有薪，依年資給予)" value={newLeave.desc} onChange={e=>setNewLeave({ ...newLeave, desc: e.target.value})} /><button onClick={handleAddLeave} className={`${editLeaveId ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-blue-600 hover:bg-blue-700'} text-white px-4 py-2 rounded text-sm font-bold shrink-0 transition`}>{editLeaveId ? '儲存修改' : '新增'}</button></div></div></div><div className="space-y-4"><div><h3 className="text-sm font-bold text-indigo-700 mb-2 border-b pb-1">區段一：公務與加班</h3><div className="flex flex-col gap-2">{leaveTypes.filter(t=>t.category==='official').map(t => (<div key={t.id} className={`flex justify-between items-center bg-white border px-3 py-2 rounded-lg text-sm group hover:border-indigo-300 ${editLeaveId === t.id ? 'ring-2 ring-yellow-400' : ''}`}><div><span className="font-bold text-gray-800 inline-block w-24">{t.name}</span><span className="text-gray-500 text-xs">{t.desc}</span></div><div className="flex gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity"><button onClick={()=>startEditLeave(t)} className="text-gray-400 hover:text-blue-600 p-1.5 bg-gray-50 rounded"><Edit size={14}/></button><button onClick={()=>handleManageLeaveTypes('delete', t.id)} className="text-gray-400 hover:text-red-600 p-1.5 bg-red-50 rounded"><Trash2 size={14}/></button></div></div>))}</div></div><div><h3 className="text-sm font-bold text-orange-700 mb-2 border-b pb-1 mt-4">區段二：私假 (依法令給假)</h3><div className="flex flex-col gap-2">{leaveTypes.filter(t=>t.category==='personal').map(t => (<div key={t.id} className={`flex justify-between items-center bg-white border px-3 py-2 rounded-lg text-sm group hover:border-orange-300 ${editLeaveId === t.id ? 'ring-2 ring-yellow-400' : ''}`}><div><span className="font-bold text-gray-800 inline-block w-24">{t.name}</span><span className="text-gray-500 text-xs">{t.desc}</span></div><div className="flex gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity"><button onClick={()=>startEditLeave(t)} className="text-gray-400 hover:text-blue-600 p-1.5 bg-gray-50 rounded"><Edit size={14}/></button><button onClick={()=>handleManageLeaveTypes('delete', t.id)} className="text-gray-400 hover:text-red-600 p-1.5 bg-red-50 rounded"><Trash2 size={14}/></button></div></div>))}</div></div></div></div>
<button onClick={handleSaveSettings} className={`mt-6 px-6 py-3 rounded shadow transition font-bold flex items-center justify-center gap-2 w-full ${isSettingsSaved ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-slate-800 hover:bg-slate-900 text-white'}`}>{isSettingsSaved ? <><CheckCircle size={18}/> 設定已儲存！</> : '儲存系統設定'}</button></div>);}
function DatabaseAdminView({ events, leaves, crud, db }) {
const [activeTab, setActiveTab] = useState('events');
const [selectedEvents, setSelectedEvents] = useState([]);
const [selectedLeaves, setSelectedLeaves] = useState([]);
const [isProcessing, setIsProcessing] = useState(false);
const [targetYear, setTargetYear] = useState(new Date().getFullYear());
const eventGroups = useMemo(() => {
const groups = {};
events.forEach(e => {
if (!groups[e.groupId]) groups[e.groupId] = { id: e.groupId, date: e.date, type: '', items: [] };
if (e.type === 'tag') { groups[e.groupId].type = e.item; groups[e.groupId].date = e.date; } else if (e.type === 'person') { groups[e.groupId].items.push(e.userName); }
});
return Object.values(groups).sort((a, b) => new Date(b.date) - new Date(a.date));
}, [events]);
const sortedLeaves = [...leaves].sort((a,b) => new Date(b.timestamp || b.start) - new Date(a.timestamp || a.start));
const handleToggleEvent = (id) => { setSelectedEvents(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]); };
const handleToggleLeave = (id) => { setSelectedLeaves(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]); };
const toggleAllEvents = () => { if (selectedEvents.length === eventGroups.length) setSelectedEvents([]); else setSelectedEvents(eventGroups.map(g => g.id)); };
const toggleAllLeaves = () => { if (selectedLeaves.length === leaves.length) setSelectedLeaves([]); else setSelectedLeaves(leaves.map(l => l.id)); };
const handleDeleteSelected = async () => {
const targetIds = activeTab === 'events' ? selectedEvents : selectedLeaves;
if (targetIds.length === 0) return alert("請先勾選要刪除的資料！");
if (!confirm(`警告！您即將刪除 ${targetIds.length} 筆資料。\n刪除後無法復原，確定要繼續嗎？`)) return;
setIsProcessing(true);
try {
if (activeTab === 'events') { for (const gid of targetIds) { await crud.deleteEventsByGroup(gid); } setSelectedEvents([]); } else { for (const lid of targetIds) { await crud.deleteLeave(lid); } setSelectedLeaves([]); }
alert("選擇的資料已成功刪除！");
} catch (e) { alert("刪除過程中發生錯誤：" + e.message); } finally { setIsProcessing(false); }
};
const handleExportYearly = () => {
let csv = "";
if (activeTab === 'events') {
const yearEvents = eventGroups.filter(g => g.date.startsWith(String(targetYear)));
if (yearEvents.length === 0) return alert(`${targetYear}年度沒有排班資料可匯出。`);
csv = "\uFEFF日期,工作項目,排班人員,群組ID\n";
yearEvents.forEach(g => {
csv += `${g.date},${g.type || '無標籤'},"${g.items.join(', ')}",${g.id}\n`;
});
} else {
const yearLeaves = leaves.filter(l => l.start.startsWith(String(targetYear)));
if (yearLeaves.length === 0) return alert(`${targetYear}年度沒有假單資料可匯出。`);
csv = "\uFEFF申請人,假別,開始時間,結束時間,時數,狀態,紀錄ID\n";
yearLeaves.forEach(l => {
csv += `${l.requesterName},${l.type},${l.start.replace('T', ' ')},${l.end.replace('T', ' ')},${l.hours},${l.status},${l.id}\n`;
});}
const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
const link = document.createElement("a");
link.href = URL.createObjectURL(blob);
link.download = `${targetYear}年度_${activeTab === 'events' ? '排班' : '假單'}完整紀錄.csv`;
link.click();
};
const handleDeleteYearly = async () => {
const typeName = activeTab === 'events' ? '排班' : '假單';
const itemsToDelete = activeTab === 'events'
? eventGroups.filter(g => g.date.startsWith(String(targetYear))).map(g => g.id)
: leaves.filter(l => l.start.startsWith(String(targetYear))).map(l => l.id);
if (itemsToDelete.length === 0) return alert(`${targetYear}年度沒有${typeName}資料可刪除。`);
const confirm1 = confirm(`【極度危險操作】\n您即將刪除 ${targetYear} 年度的「所有${typeName}資料」共 ${itemsToDelete.length} 筆。\n強烈建議您先執行【匯出】作為備份。\n刪除後將無法復原，請問確定要繼續嗎？`);
if (!confirm1) return;
const confirm2 = prompt(`為確認您的操作不是誤觸，請輸入要刪除的年份數字：「${targetYear}」`);
if (confirm2 !== String(targetYear)) return alert("輸入的年份不符，已取消刪除操作。");
setIsProcessing(true);
try {
if (activeTab === 'events') {
for (const gid of itemsToDelete) { await crud.deleteEventsByGroup(gid); }
} else {
for (const lid of itemsToDelete) { await crud.deleteLeave(lid); }}
alert(`${targetYear}年度 ${typeName}資料已全部清空！`);
if (activeTab === 'events') setSelectedEvents([]);
else setSelectedLeaves([]);
} catch (e) {
alert("刪除過程中發生錯誤: " + e.message);
} finally {
setIsProcessing(false);}
};
return (
<div className="max-w-5xl mx-auto space-y-6">
<div className="bg-white p-4 rounded shadow-sm flex flex-col md:flex-row justify-between items-center gap-4"><h2 className="text-xl font-bold flex items-center gap-2 text-red-600"><Database /> 資料庫清理與管理</h2><div className="bg-gray-100 p-1 rounded-lg flex text-sm"><button onClick={() => {setActiveTab('events'); setSelectedEvents([]);}} className={`px-4 py-2 rounded font-bold transition ${activeTab === 'events' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}>📅 排班紀錄 ({eventGroups.length})</button><button onClick={() => {setActiveTab('leaves'); setSelectedLeaves([]);}} className={`px-4 py-2 rounded font-bold transition ${activeTab === 'leaves' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}>📋 假單紀錄 ({leaves.length})</button></div></div>
<div className="bg-gray-50 border border-gray-200 p-4 rounded-lg flex flex-col md:flex-row justify-between items-center gap-4">
<div className="flex items-center gap-2">
<span className="font-bold text-gray-700">年度批次操作：</span>
<select className="border border-gray-300 p-2 rounded text-sm bg-white font-bold" value={targetYear} onChange={e=>setTargetYear(Number(e.target.value))}>
{[...Array(11)].map((_, i) => { const y = new Date().getFullYear() - 5 + i; return <option key={y} value={y}>{y} 年度</option> })}</select></div>
<div className="flex gap-2 w-full md:w-auto">
<button onClick={handleExportYearly} className="flex-1 md:flex-none bg-emerald-600 text-white px-4 py-2 rounded text-sm font-bold flex items-center justify-center gap-2 hover:bg-emerald-700 transition">
<Download size={16} /> 匯出 {targetYear} 年{activeTab === 'events' ? '排班' : '假單'}</button>
<button onClick={handleDeleteYearly} disabled={isProcessing} className="flex-1 md:flex-none bg-red-600 text-white px-4 py-2 rounded text-sm font-bold flex items-center justify-center gap-2 hover:bg-red-700 transition disabled:opacity-50">
<Trash2 size={16} /> 刪除 {targetYear} 年{activeTab === 'events' ? '排班' : '假單'}</button></div></div>
<div className="bg-red-50 border border-red-200 text-red-700 p-4 rounded-lg flex items-start gap-3"><AlertTriangle className="shrink-0 mt-0.5" size={20} /><div className="text-sm"><strong>管理員專用功能：</strong> 在此刪除的資料將會從雲端資料庫永久抹除，請謹慎使用。建議僅用於清理測試資料或無效的歷史紀錄。</div></div>
<div className="bg-white rounded shadow-sm border overflow-hidden"><div className="p-3 bg-gray-50 border-b flex justify-between items-center"><span className="text-sm font-bold text-gray-600">已選取 {activeTab === 'events' ? selectedEvents.length : selectedLeaves.length} 項目 (手動勾選)</span><button onClick={handleDeleteSelected} disabled={isProcessing || (activeTab === 'events' ? selectedEvents.length === 0 : selectedLeaves.length === 0)} className={`bg-red-600 text-white px-4 py-2 rounded text-sm font-bold flex items-center gap-2 transition ${isProcessing || (activeTab === 'events' ? selectedEvents.length === 0 : selectedLeaves.length === 0) ? 'opacity-50 cursor-not-allowed' : 'hover:bg-red-700'}`}>{isProcessing ? <><Loader2 size={16} className="animate-spin" /> 刪除中...</> : <><Trash2 size={16} /> 批次刪除勾選項目</>}</button></div><div className="overflow-x-auto max-h-[60vh]">{activeTab === 'events' ? (<table className="w-full text-sm text-left"><thead className="bg-gray-100 text-gray-600 sticky top-0 z-10 shadow-sm"><tr><th className="p-3 w-12 text-center"><input type="checkbox" onChange={toggleAllEvents} checked={eventGroups.length > 0 && selectedEvents.length === eventGroups.length} className="w-4 h-4 text-red-600 rounded cursor-pointer" /></th><th className="p-3 w-32">日期</th><th className="p-3 w-40">工作項目</th><th className="p-3">排班人員</th><th className="p-3 w-40 text-xs text-gray-400">群組 ID</th></tr></thead><tbody>{eventGroups.map(g => (<tr key={g.id} className={`border-b hover:bg-red-50 transition cursor-pointer ${selectedEvents.includes(g.id) ? 'bg-red-50/50' : ''}`} onClick={() => handleToggleEvent(g.id)}><td className="p-3 text-center" onClick={e=>e.stopPropagation()}><input type="checkbox" checked={selectedEvents.includes(g.id)} onChange={() => handleToggleEvent(g.id)} className="w-4 h-4 text-red-600 rounded cursor-pointer" /></td><td className="p-3 font-medium">{g.date}</td><td className="p-3 text-blue-700 font-bold">{g.type || '無標籤'}</td><td className="p-3 flex gap-1 flex-wrap">{g.items.length > 0 ? g.items.map((n, i) => <span key={i} className="bg-gray-200 px-2 py-0.5 rounded-full text-xs">{n}</span>) : '-'}</td><td className="p-3 text-xs text-gray-400 truncate max-w-[120px]" title={g.id}>{g.id}</td></tr>))}</tbody></table>) : (<table className="w-full text-sm text-left"><thead className="bg-gray-100 text-gray-600 sticky top-0 z-10 shadow-sm"><tr><th className="p-3 w-12 text-center"><input type="checkbox" onChange={toggleAllLeaves} checked={leaves.length > 0 && selectedLeaves.length === leaves.length} className="w-4 h-4 text-red-600 rounded cursor-pointer" /></th><th className="p-3 w-24">申請人</th><th className="p-3 w-24">假別</th><th className="p-3">時間區間</th><th className="p-3 w-20">狀態</th><th className="p-3 w-40 text-xs text-gray-400">紀錄 ID</th></tr></thead><tbody>{sortedLeaves.map(l => (<tr key={l.id} className={`border-b hover:bg-red-50 transition cursor-pointer ${selectedLeaves.includes(l.id) ? 'bg-red-50/50' : ''}`} onClick={() => handleToggleLeave(l.id)}><td className="p-3 text-center" onClick={e=>e.stopPropagation()}><input type="checkbox" checked={selectedLeaves.includes(l.id)} onChange={() => handleToggleLeave(l.id)} className="w-4 h-4 text-red-600 rounded cursor-pointer" /></td><td className="p-3 font-medium text-gray-800">{l.requesterName}</td><td className="p-3 font-bold text-indigo-600">{l.type}</td><td className="p-3 text-xs text-gray-600">{l.start.replace('T', ' ')} ~ {l.end.replace('T', ' ')} <br/>({l.hours} 小時)</td><td className="p-3"><span className={`px-2 py-1 rounded text-xs font-bold ${l.status === 'approved' ? 'bg-green-100 text-green-700' : l.status === 'rejected' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}`}>{l.status}</span></td><td className="p-3 text-xs text-gray-400 truncate max-w-[120px]" title={l.id}>{l.id}</td></tr>))}</tbody></table>)}</div></div></div>);}
function LoginScreen({ auth }) {
const [isLoggingIn, setIsLoggingIn] = useState(false);
const handleGoogleLogin = async () => { if (!auth) { alert("Firebase 尚未連線完成，請稍後再試。"); return; } setIsLoggingIn(true); const provider = new GoogleAuthProvider(); try { await signInWithPopup(auth, provider); } catch (error) { console.error("Google Sign-In Error", error); alert("登入被中斷或發生錯誤，請重試。\n詳細訊息: " + error.message); setIsLoggingIn(false); } };
return (<div className="min-h-screen bg-slate-100 flex items-center justify-center p-4"><div className="bg-white w-full max-w-sm p-8 rounded-xl shadow-lg text-center"><div className="w-16 h-16 bg-blue-600 rounded-xl mx-auto mb-4 flex items-center justify-center text-white"><Calendar size={32}/></div><h1 className="text-2xl font-bold text-gray-800 mb-1">差勤排班系統</h1><p className="text-gray-400 text-sm mb-8">高屏澎東職務再設計專案單位</p><div className="space-y-4"><button onClick={handleGoogleLogin} disabled={isLoggingIn} className="w-full py-3.5 rounded-lg font-bold bg-white border-2 border-gray-200 text-gray-700 transition-all flex items-center justify-center gap-3 hover:bg-gray-50 shadow-sm disabled:opacity-50">{isLoggingIn ? (<Loader2 className="animate-spin text-blue-600" size={20}/>) : (<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" className="w-5 h-5"/>)}<span>{isLoggingIn ? '正在驗證帳號...' : '使用 Google 帳號登入'}</span></button></div></div></div>);}
const root = createRoot(document.getElementById('root'));
root.render(<App />);</script></body></html>
