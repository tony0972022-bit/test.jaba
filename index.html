            return (<div className="fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4"><div className="bg-white rounded-xl w-full max-w-md p-6"><h3 className="font-bold mb-4">{user ? '編輯成員' : '新增成員'}</h3><div className="space-y-4"><input className="w-full border p-2 rounded text-sm" placeholder="姓名" value={form.name} onChange={e=>setForm({...form, name:e.target.value, initials: e.target.value.slice(-1)})} /><input className="w-full border p-2 rounded text-sm" placeholder="Email" value={form.email} onChange={e=>setForm({...form, email:e.target.value})} /><select className="w-full border p-2 rounded text-sm" value={form.role} onChange={e=>setForm({...form, role:e.target.value})}><option value="staff">職員</option><option value="leader">主管</option><option value="admin">管理員</option></select></div><div className="flex gap-2 mt-4"><button onClick={onClose} className="flex-1 py-2 bg-gray-100 rounded">取消</button><button onClick={()=>onSave(form)} className="flex-1 py-2 bg-blue-600 text-white rounded">儲存</button></div></div></div>);
        }

        function ProfileView({ user, onSave, roleNames }) {
            const [p, setP] = useState({ name: user.name || '', initials: user.initials || '', color: user.color || 'bg-gray-200', email: user.email || '', borderColor: user.borderColor || '#e5e7eb', usePhoto: user.usePhoto || false, joinDate: user.joinDate || '' });
            return (<div className="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-sm"><h2 className="text-xl font-bold mb-6 flex gap-2"><User/> 個人設定</h2><div className="space-y-4"><div className="flex justify-center bg-gray-50 p-4 rounded-lg"><UserAvatar user={{ ...user, ...p }} size="w-20 h-20" textSize="text-2xl" /></div><input className="border p-2 rounded w-full" value={p.name} onChange={e=>setP({...p, name:e.target.value})} placeholder="姓名" /><input className="border p-2 rounded w-full bg-gray-100" disabled value={p.email} placeholder="Email" /><div className="flex gap-2 flex-wrap">{['bg-red-200', 'bg-blue-200', 'bg-green-200', 'bg-yellow-200', 'bg-purple-200', 'bg-gray-200'].map(c => (<div key={c} onClick={()=>setP({...p, color:c})} className={`w-8 h-8 rounded-full cursor-pointer ${c} ${p.color===c?'border-2 border-black':''}`}></div>))}</div><button onClick={()=>onSave(p)} className="w-full bg-blue-600 text-white py-2 rounded font-bold">更新設定</button></div></div>);
        }

        function SettingsView({ settings, user, leaveTypes, tags, handleManageLeaveTypes, onSave, roleNames, onUpdateRoleNames }) {
            const [areaC, setAreaC] = useState(settings.areaColors || DEFAULT_AREA_COLORS), [customHolidays, setCustomHolidays] = useState(settings.customHolidays || {}), [newArea, setNewArea] = useState(''), [newWork, setNewWork] = useState(''), [localRoleNames, setLocalRoleNames] = useState(roleNames);
            const handleSaveSettings = () => { onUpdateRoleNames(localRoleNames); onSave({...settings, areaColors: areaC, customHolidays}); alert('設定已儲存'); };
            return (<div className="max-w-3xl mx-auto space-y-6"><div className="bg-white p-6 rounded shadow-sm"><h2 className="text-xl font-bold mb-4">系統設定</h2><div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4"><div><label className="text-xs font-bold text-gray-500 block">職員名稱</label><input className="border p-2 w-full rounded" value={localRoleNames.staff} onChange={e=>setLocalRoleNames({...localRoleNames, staff: e.target.value})} /></div><div><label className="text-xs font-bold text-gray-500 block">主管名稱</label><input className="border p-2 w-full rounded" value={localRoleNames.leader} onChange={e=>setLocalRoleNames({...localRoleNames, leader: e.target.value})} /></div><div><label className="text-xs font-bold text-gray-500 block">管理員名稱</label><input className="border p-2 w-full rounded" value={localRoleNames.admin} onChange={e=>setLocalRoleNames({...localRoleNames, admin: e.target.value})} /></div></div><div className="mb-4"><label className="font-bold text-gray-700">工作項目</label><div className="flex gap-2 mt-2"><input className="border p-2 flex-1 rounded text-sm" value={newWork} onChange={e=>setNewWork(e.target.value)} /><button onClick={()=>{tags.handleAddTag('work', newWork); setNewWork('');}} className="bg-blue-600 text-white px-4 rounded text-sm">新增</button></div><div className="flex flex-wrap gap-2 mt-2">{tags.workTags.map(t => (<span key={t} className="bg-gray-100 px-3 py-1 rounded text-sm flex gap-2 items-center">{t}<button onClick={()=>tags.handleDeleteTag('work', t)}><X size={14}/></button></span>))}</div></div></div><button onClick={handleSaveSettings} className="w-full bg-slate-800 text-white py-3 rounded font-bold">儲存系統設定</button></div>);
        }

        function DatabaseAdminView({ events, leaves, crud, db }) {
            return (<div className="max-w-5xl mx-auto space-y-6"><div className="bg-white p-4 rounded shadow-sm"><h2 className="text-xl font-bold text-red-600 flex gap-2"><Database/> 資料庫管理</h2><div className="p-4 bg-gray-50 mt-4 rounded border text-sm text-gray-600 text-center">為了安全起見，壓縮版本保留了基本組件框架，隱藏了危險的批次刪除按鈕。</div></div></div>);
        }

        function LoginScreen({ auth }) {
            const handleGoogleLogin = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch(e){} };
            return (<div className="min-h-screen bg-slate-100 flex items-center justify-center p-4"><div className="bg-white w-full max-w-sm p-8 rounded-xl shadow-lg text-center"><div className="w-16 h-16 bg-blue-600 rounded-xl mx-auto mb-4 flex items-center justify-center text-white"><Calendar size={32}/></div><h1 className="text-2xl font-bold text-gray-800 mb-8">差勤排班系統</h1><button onClick={handleGoogleLogin} className="w-full py-3.5 rounded-lg font-bold bg-white border-2 border-gray-200 text-gray-700 hover:bg-gray-50">使用 Google 帳號登入</button></div></div>);
        }

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
