// Simple mail sender (internal use)
async function sendMail({ targetEmail, subject, body }) {
  try {
    if (!MAIL_WEBAPP_URL) throw new Error("MAIL_WEBAPP_URL 未設定");
    if (!targetEmail) throw new Error("targetEmail 為空，未寄信");

    // 使用 x-www-form-urlencoded 避免瀏覽器 CORS preflight（GitHub Pages 常見）
    const form = new URLSearchParams();
    form.append("key", MAIL_SECRET_KEY);
    form.append("targetEmail", targetEmail);
    form.append("subject", subject || "");
    form.append("body", body || "");

    // 逾時控制（避免一直轉圈/無回應）
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);

    const r = await fetch(MAIL_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
      body: form.toString(),
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    const t = await r.text();
    let j = null;
    try { j = JSON.parse(t); } catch {}

    if (!r.ok) throw new Error(`HTTP ${r.status}：${(t || "").slice(0, 200)}`);
    if (!j) throw new Error(`非 JSON 回應：${(t || "").slice(0, 200)}`);
    if (j.status !== "success") throw new Error(j.message || "寄信失敗");

    console.log("Mail sent:", j);
    return true;
  } catch (e) {
    const msg = (e && e.name === "AbortError") ? "寄信逾時（12 秒未回應），請稍後再試或檢查 Apps Script 部署/權限" : (e?.message || String(e));
    alert("寄信失敗：" + msg);
    console.warn("sendMail error:", e);
    return false;
  }
}


// --- DateTime formatter (for email timeline) ---
const fmtDT = (v) => {
  if (!v) return '—';
  try {
    const d = (typeof v === 'object' && v !== null && typeof v.toDate === 'function') ? v.toDate()
      : (typeof v === 'object' && v !== null && typeof v.seconds === 'number') ? new Date(v.seconds * 1000)
      : new Date(v);
    if (!d || isNaN(d.getTime())) return '—';
    return d.toLocaleString('zh-TW', { hour12: false });
  } catch {
    return '—';
  }
};

// --- ISO datetime formatter (remove 'T' and seconds) ---
const fmtISO = (s) => {
  if (!s) return '—';
  try {
    if (typeof s === 'string') return s.replace('T',' ').replace(/:\d\d(\.\d+)?$/, '').slice(0,16);
    return fmtDT(s);
  } catch {
    return '—';
  }
};

// 取得即時天氣（Open-Meteo，免 API key），每日更新並快取於 localStorage
async function fetchWeatherForLocations() {
  const todayKey = `weather_cache_${getLocalDateString()}`;
  try {
    const cached = localStorage.getItem(todayKey);
    if (cached) return JSON.parse(cached);
  } catch {}

  const results = [];
  for (const loc of WEATHER_LOCATIONS) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&forecast_days=7&timezone=Asia%2FTaipei`;
      const r = await fetch(url);
      const j = await r.json();
      const temp = j?.current?.temperature_2m;
      const wind = j?.current?.wind_speed_10m;
      const curCode = j?.current?.weather_code;
      const rain = j?.daily?.precipitation_probability_max?.[0];
      const uv = j?.daily?.uv_index_max?.[0];

      const daily = j?.daily || {};
      const times = Array.isArray(daily.time) ? daily.time : [];
      const week = times.slice(0, 7).map((t, idx) => ({
        date: t,
        tmax: daily.temperature_2m_max?.[idx],
        tmin: daily.temperature_2m_min?.[idx],
        rain: daily.precipitation_probability_max?.[idx],
        uv: daily.uv_index_max?.[idx],
        code: daily.weather_code?.[idx],
      }));

      results.push({
        location: loc.location,
        temp: (typeof temp === 'number') ? `${Math.round(temp)}°C` : '—',
        wind: (typeof wind === 'number') ? `${Math.round(wind)} km/h` : '—',
        rain: (typeof rain === 'number') ? `${Math.round(rain)}%` : '—',
        uv: (typeof uv === 'number') ? `${Math.round(uv)}` : '—',
        week,
        _raw: { temp, wind, rain, uv, curCode }
      });
    } catch (e) {
      results.push({ location: loc.location, temp:'—', wind:'—', rain:'—', uv:'—', _raw:{} });
    }
  }

  try { localStorage.setItem(todayKey, JSON.stringify(results)); } catch {}
  return results;
}

// deterministic daily variation helper
const hashSeed = (s) => {
  let h = 2166136261;
  for (let i=0; i<s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
};
const pickBySeed = (arr, seedStr) => {
  if (!arr || arr.length === 0) return '';
  const idx = hashSeed(String(seedStr)) % arr.length;
  return arr[idx];
};

// --- Helper Function: Get Local Date String without UTC shifting issues ---
const getLocalDateString = (d = new Date()) => {
const tzOffset = d.getTimezoneOffset() * 60000;
return new Date(d.getTime() - tzOffset).toISOString().split('T')[0];
};

const getWeekdayLabel = (dateStr) => {
  try {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00');
    const map = ['日','一','二','三','四','五','六'];
    const w = map[d.getDay()];
    return w ? `（${w}）` : '';
  } catch { return ''; }
};

// --- Helper: Effective leave hours for stats (跨天以 8 小時/天計) ---
// 用於假別統計等跨日計算：若跨天，直接以「天數 * 8 小時」計算，避免時段格式差異造成誤差
const getEffectiveLeaveHours = (l) => {
  try {
    const s = (l.start || '').split('T')[0];
    const e = (l.end || '').split('T')[0];
    if (!s || !e) return Number(l.hours || 0);
    if (s === e) return Number(l.hours || 0);
    const sd = new Date(s + 'T00:00');
    const ed = new Date(e + 'T00:00');
    const days = Math.floor((ed - sd) / 86400000) + 1;
    return Math.max(0, days) * 8;
  } catch {
    return Number(l.hours || 0);
  }
};

// 讓「外框顏色」同時決定「背景顏色」（背景用帶透明度的同色系），降低設定複雜度
const hexToRgba = (hex, alpha = 0.25) => {
  try {
    const h = String(hex || '').replace('#','').trim();
    if (h.length !== 6) return `rgba(229,231,235,${alpha})`;
    const r = parseInt(h.slice(0,2), 16);
    const g = parseInt(h.slice(2,4), 16);
    const b = parseInt(h.slice(4,6), 16);
    if ([r,g,b].some(v => Number.isNaN(v))) return `rgba(229,231,235,${alpha})`;
    return `rgba(${r},${g},${b},${alpha})`;
  } catch {
    return `rgba(229,231,235,${alpha})`;
  }
};

    if (!e || !e.groupId) return;
    if (!groups[e.groupId]) groups[e.groupId] = { tag: null, people: [] };
    if (e.type === 'tag') groups[e.groupId].tag = e;
    if (e.type === 'person') groups[e.groupId].people.push(e);
  });

  const today = getLocalDateString(new Date());
  const items = Object.values(groups)
    .filter(g => g.tag && (!g.people || g.people.length === 0))
    .filter(g => (g.tag.date || '') >= today)
    .sort((a,b) => String(a.tag.date||'').localeCompare(String(b.tag.date||'')))
    .slice(0, 10)
    .map(g => ({ date: g.tag.date, item: g.tag.item, slot: g.tag.slot || 'all_day', groupId: g.tag.groupId }));

  return { count: Object.values(groups).filter(g => g.tag && (!g.people || g.people.length === 0) && (g.tag.date || '') >= today).length, items };
}, [calendarEvents]);

// (送出申請不發mail)
alert("差單已送出，已顯示在日曆上！"); } catch (e) { alert("送出失敗"); } finally { setSubmittingTaskId(null); } }
const handleManualSubmit = async (e) => {

finalHours = 4;

finalStart = `${slotDate}T13:00`;
finalEnd = `${slotDate}T17:00`;
finalHours = 4;

finalStart = `${slotDate}T08:00`;
finalEnd = `${slotDate}T17:00`;
finalHours = 8;}

  // 自訂時間：依「少於一天 / 大於一天」準備資料

    if (!shortDate) { alert("請選擇日期"); return; }
    const ss = `${shortDate}T${String(shortStartH).padStart(2,'0')}:${String(shortStartM).padStart(2,'0')}`;
    const ee = `${shortDate}T${String(shortEndH).padStart(2,'0')}:${String(shortEndM).padStart(2,'0')}`;
    const s = new Date(ss);
    const e = new Date(ee);
    if (isNaN(s.getTime()) || isNaN(e.getTime()) || e <= s) { alert("結束時間需晚於開始時間"); return; }
    if (hours <= 0) { alert("總計時數必須大於 0"); return; }
    finalStart = ss;
    finalEnd = ee;
    finalHours = hours;
  } else {
    if (!multiStartDate) { alert("請選擇起始日期"); return; }
    const picked = (multiDates || []).filter(x => multiSelected && multiSelected[x.date]).map(x => x.date).sort();

    finalEnd = `${picked[picked.length-1]}T${String(multiEndH).padStart(2,'0')}:${String(multiEndM).padStart(2,'0')}`;
    // hours 由上方 useEffect 依工作時段重疊自動計算
    finalHours = Number(hours || 0);
  }
}

leaves.forEach(l => { if ((l.requesterId === user.uid || l.requesterId === user.docId) && l.status === 'approved' && l.type === '加班申請(列計)') { totalOvertime += Number(l.hours); } });
let usedCompensatory = 0;
leaves.forEach(l => { if ((l.requesterId === user.uid || l.requesterId === user.docId) && l.status === 'approved' && l.type === '補休') { usedCompensatory += Number(l.hours); } });
const balance = totalOvertime - usedCompensatory;
if (finalHours > balance) { alert(`補休時數不足！\n目前可用餘額: ${balance} 小時\n您申請時數: ${finalHours} 小時`); return; }}

setForm({ type: '', start:'', end:'', reason:'', deputyId:'' });

setSlotDate(getLocalDateString());
setSlotType('all_day');
} catch (e) { alert("送出失敗，請稍後再試。"); } finally { setIsSubmitting(false); }
};

else if (totalMonths >= 36 && totalMonths < 60) days = 14;

function LoginScreen({ auth }) {

const handleGoogleLogin = async () => { if (!auth) { alert("Firebase 尚未連線完成，請稍後再試。"); return; } setIsLoggingIn(true); const provider = new GoogleAuthProvider(); try { await signInWithPopup(auth, provider); } catch (error) { console.error("Google Sign-In Error", error); alert("登入被中斷或發生錯誤，請重試。\n詳細訊息: " + error.message); setIsLoggingIn(false); } };
return (<div className="min-h-screen bg-slate-100 flex items-center justify-center p-4"><div className="bg-white w-full max-w-sm p-8 rounded-xl shadow-lg text-center"><div className="w-16 h-16 bg-blue-600 rounded-xl mx-auto mb-4 flex items-center justify-center text-white"><Calendar size={32}/></div><h1 className="text-2xl font-bold text-gray-800 mb-1">差勤排班系統</h1><p className="text-gray-400 text-sm mb-8">高屏澎東職務再設計專案單位</p><div className="space-y-4"><button onClick={handleGoogleLogin} disabled={isLoggingIn} className="w-full py-3.5 rounded-lg font-bold bg-white border-2 border-gray-200 text-gray-700 transition-all flex items-center justify-center gap-3 hover:bg-gray-50 shadow-sm disabled:opacity-50">{isLoggingIn ? (<Loader2 className="animate-spin text-blue-600" size={20}/>) : (<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" className="w-5 h-5"/>)}<span>{isLoggingIn ? '正在驗證帳號...' : '使用 Google 帳號登入'}</span></button></div></div></div>);}
const root = createRoot(document.getElementById('root'));
root.render(<App />);</script></body></html>
